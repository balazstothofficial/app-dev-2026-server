# The Gradle Wrapper makes sure every developer and every build server uses the same
# Gradle version, which guarantees consistent builds across machines. It downloads the
# specified Gradle version automatically and does not require a local Gradle installation.
#
# Files that must be committed to Git:
# - gradlew
# - gradlew.bat
# - gradle/wrapper/gradle-wrapper.jar
# - gradle/wrapper/gradle-wrapper.properties
#
# Files that should NOT be committed:
# - anything inside ~/.gradle on your machine (local caches)
# - downloaded Gradle distributions in wrapper/dists (generated at runtime)
#
# Resources
# - https://docs.gradle.org/current/userguide/gradle_wrapper.html

#Thu Sep 18 15:34:50 CEST 2025
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.8.1-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
